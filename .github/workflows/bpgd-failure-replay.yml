name: BPGD Failure Replay

on:
  pull_request:
    branches:
      - phase-3a-hypotheses-experiments
    paths:
      - 'phase4/bb/**'
      - '.github/workflows/bpgd-failure-replay.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bpgd-failure-replay-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-3b-4a-audit-smoke
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install numpy numba
      - name: Regenerate failure corpus and replay T/clipping variants
        working-directory: phase4/bb
        run: python run_regenerate_and_replay_failures.py
      - name: Replay semantic decoder variants on exact failures
        working-directory: phase4/bb
        run: python run_semantic_failure_replay.py
      - name: Analyze semantic replay results
        working-directory: phase4/bb
        run: python analyze_semantic_failure_replay.py
      - name: Commit generated replay records and analysis
        continue-on-error: true
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            phase4/bb/stateful_failure_corpus.json \
            phase4/bb/exact_failure_variant_results.json \
            phase4/bb/semantic_failure_replay_results.json \
            phase4/bb/semantic_failure_replay_analysis.json \
            phase4/bb/SEMANTIC_FAILURE_REPLAY_ANALYSIS.md
          if git diff --cached --quiet; then
            echo "Generated replay records and analysis are already current."
            exit 0
          fi
          git commit -m "Analyze exact BPGD semantic replay results [skip ci]"
          for attempt in 1 2 3; do
            git fetch origin phase-3b-4a-audit-smoke
            if git rebase origin/phase-3b-4a-audit-smoke && \
               git push origin HEAD:phase-3b-4a-audit-smoke; then
              echo "Generated results committed successfully."
              exit 0
            fi
            echo "Push attempt ${attempt} failed; retrying after refresh."
            git rebase --abort || true
            sleep 5
          done
          echo "::warning::Generated results could not be committed because the branch changed repeatedly. Artifacts will still be uploaded."
          exit 1
      - name: Upload replay artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bpgd-failure-replay
          path: |
            phase4/bb/stateful_failure_corpus.json
            phase4/bb/exact_failure_variant_results.json
            phase4/bb/semantic_failure_replay_results.json
            phase4/bb/semantic_failure_replay_analysis.json
            phase4/bb/SEMANTIC_FAILURE_REPLAY_ANALYSIS.md
